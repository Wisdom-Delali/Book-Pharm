{% if page_obj.paginator.num_pages > 1 %}
<div class="pagination">
  <p class="text-muted">Showing page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} ({{ page_obj.paginator.count }} customers)</p>
  <div class="pagination__controls">
    {% if page_obj.has_previous %}
    <button class="btn btn--secondary" hx-get="{% url 'portal:customer_list' %}?page={{ page_obj.previous_page_number }}&q={{ query }}" hx-target="#customer-content" hx-swap="outerHTML">Previous</button>
    {% else %}
    <button class="btn btn--secondary" disabled>Previous</button>
    {% endif %}
    {% if page_obj.has_next %}
    <button class="btn btn--secondary" hx-get="{% url 'portal:customer_list' %}?page={{ page_obj.next_page_number }}&q={{ query }}" hx-target="#customer-content" hx-swap="outerHTML">Next</button>
    {% else %}
    <button class="btn btn--secondary" disabled>Next</button>
    {% endif %}
  </div>
</div>
{% endif %}
