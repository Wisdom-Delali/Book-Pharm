<div class="panel__header">
  <h3>Record Jumia Order</h3>
  <button class="panel__close" hx-get="{% url 'portal:marketplace_list' %}" hx-target="#marketplace-content" hx-swap="outerHTML">&times;</button>
</div>

{% if form_errors %}
{% for error in form_errors %}<p class="form-error">{{ error }}</p>{% endfor %}
{% endif %}

<form class="panel__form"
      hx-post="{% url 'portal:marketplace_create' %}"
      hx-target="#marketplace-content" hx-swap="outerHTML"
      x-data="{ rows: [{ key: 1 }], nextKey: 2 }">
  {% csrf_token %}

  <div class="form-field">
    <label class="form-label" for="external_ref">Jumia order reference</label>
    <input type="text" name="external_ref" id="external_ref" placeholder="e.g. JM-2026-00123">
    <p class="form-help">Optional, but makes it easier to match against Jumia's own dashboard later.</p>
  </div>

  <div class="form-field">
    <label class="form-label">Books sold</label>
    <template x-for="row in rows" :key="row.key">
      <div class="jumia-item-row">
        <select name="book_id" required>
          <option value="">Select a book...</option>
          {% for book in books %}
          <option value="{{ book.id }}">{{ book.title }} &mdash; GHS {{ book.selling_price }} ({{ book.stock_qty }} in stock)</option>
          {% endfor %}
        </select>
        <input type="number" name="qty" min="1" value="1" required>
        <button type="button" class="jumia-item-row__remove" x-show="rows.length > 1" x-on:click="rows = rows.filter(r => r.key !== row.key)">&times;</button>
      </div>
    </template>
    <button type="button" class="btn btn--secondary" style="margin-top: 0.5rem;" x-on:click="rows.push({ key: nextKey++ })">+ Add another book</button>
  </div>

  <div class="panel__actions">
    <button type="button" class="btn btn--secondary" hx-get="{% url 'portal:marketplace_list' %}" hx-target="#marketplace-content" hx-swap="outerHTML">Cancel</button>
    <button type="submit" class="btn btn--primary">Record Order</button>
  </div>
</form>
